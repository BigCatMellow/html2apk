name: Build Weekend Activities APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-weekend-activities-once.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        working-directory: apps/weekend-activities
        run: npm install

      - name: Build Android APK
        working-directory: apps/weekend-activities
        run: npm run build:android-ci

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: weekend-activities-debug-apk
          path: apps/weekend-activities/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
