name: Publish APK Release

on:
  workflow_dispatch:
    inputs:
      app:
        description: App to publish
        required: true
        type: choice
        options:
          - meditation
          - ereader
          - shoulder-timer
      version:
        description: Version label, for example 1.0.0
        required: true
        default: 1.0.0
  pull_request:
    paths:
      - '.github/workflows/publish-apk-release.yml'

permissions:
  contents: write

concurrency:
  group: apk-release-${{ github.event_name }}-${{ inputs.app || 'validation' }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      APP: ${{ github.event_name == 'workflow_dispatch' && inputs.app || 'meditation' }}
      VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || '0.0.0-test' }}
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Verify permanent signing secrets
        if: github.event_name == 'workflow_dispatch'
        run: |
          test -n "$KEYSTORE_B64" || { echo "::error::Missing ANDROID_KEYSTORE_BASE64 repository secret"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "::error::Missing ANDROID_KEYSTORE_PASSWORD repository secret"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "::error::Missing ANDROID_KEY_ALIAS repository secret"; exit 1; }

      - name: Install dependencies
        working-directory: apps/${{ env.APP }}
        run: npm install

      - name: Create Android project
        working-directory: apps/${{ env.APP }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if npm run build:android-ci; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep $((attempt * 30))
          done

      - name: Set release version
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os, re

          app = os.environ['APP']
          version = os.environ['VERSION']
          version_code = os.environ['VERSION_CODE']
          path = Path('apps') / app / 'android' / 'app' / 'build.gradle'
          text = path.read_text()
          text, count_code = re.subn(r'versionCode\s+\d+', f'versionCode {version_code}', text, count=1)
          text, count_name = re.subn(r'versionName\s+"[^"]*"', f'versionName "{version}"', text, count=1)
          if count_code != 1 or count_name != 1:
              raise SystemExit('Could not set Android versionCode/versionName in generated build.gradle')
          path.write_text(text)
          print(f'Set {app} versionName={version} versionCode={version_code}')
          PY

      - name: Build unsigned release APK
        working-directory: apps/${{ env.APP }}/android
        run: ./gradlew assembleRelease

      - name: Decode permanent signing key
        if: github.event_name == 'workflow_dispatch'
        run: |
          KEYSTORE="$RUNNER_TEMP/html2apk-release.p12"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          echo "KEYSTORE=$KEYSTORE" >> "$GITHUB_ENV"

      - name: Create temporary validation signing key
        if: github.event_name == 'pull_request'
        run: |
          KEYSTORE="$RUNNER_TEMP/html2apk-validation.p12"
          VALIDATION_PASSWORD='html2apk-validation-only'
          VALIDATION_ALIAS='html2apk-validation'
          keytool -genkeypair \
            -keystore "$KEYSTORE" \
            -storetype PKCS12 \
            -storepass "$VALIDATION_PASSWORD" \
            -keypass "$VALIDATION_PASSWORD" \
            -alias "$VALIDATION_ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -sigalg SHA256withRSA \
            -validity 2 \
            -dname 'CN=HTML2APK Validation, O=BigCatMellow, C=US'
          echo "KEYSTORE=$KEYSTORE" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$VALIDATION_PASSWORD" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=$VALIDATION_ALIAS" >> "$GITHUB_ENV"

      - name: Align, sign, and verify APK
        run: |
          set -euo pipefail
          BUILD_TOOLS_VERSION="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort -V | tail -1)"
          ZIPALIGN="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/zipalign"
          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/apksigner"
          UNSIGNED="apps/${APP}/android/app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED="$RUNNER_TEMP/${APP}-${VERSION}-aligned.apk"
          SIGNED="${APP}-${VERSION}.apk"

          test -f "$UNSIGNED" || { echo "::error::Unsigned release APK not found at $UNSIGNED"; exit 1; }
          "$ZIPALIGN" -f -p 4 "$UNSIGNED" "$ALIGNED"
          "$APKSIGNER" sign \
            --ks "$KEYSTORE" \
            --ks-type PKCS12 \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEYSTORE_PASSWORD \
            --out "$SIGNED" \
            "$ALIGNED"
          "$APKSIGNER" verify --verbose --print-certs "$SIGNED"

      - name: Upload signed validation APK
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: release-signing-validation
          path: ${{ env.APP }}-${{ env.VERSION }}.apk
          if-no-files-found: error
          retention-days: 3

      - name: Publish GitHub Release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${APP}-v${VERSION}"
          gh release create "$TAG" "${APP}-${VERSION}.apk" \
            --target "${GITHUB_SHA}" \
            --title "${APP} ${VERSION}" \
            --notes "Permanently signed APK built from the HTML2APK repository. Future releases of this package use the same private signing identity so Android can install them as updates."
