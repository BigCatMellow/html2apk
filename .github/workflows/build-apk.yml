name: Build APK

on:
  workflow_dispatch:
    inputs:
      app:
        description: App to build
        required: true
        type: choice
        options:
          - meditation
          - ereader
          - shoulder-timer
          - morning-edition
  pull_request:
    paths:
      - 'apps/**'
      - '.github/workflows/build-apk.yml'
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        app: [meditation, ereader, shoulder-timer, morning-edition]
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        if: github.event_name != 'workflow_dispatch' || matrix.app == inputs.app
        uses: actions/checkout@v4

      - name: Set up Node.js
        if: github.event_name != 'workflow_dispatch' || matrix.app == inputs.app
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        if: github.event_name != 'workflow_dispatch' || matrix.app == inputs.app
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        if: github.event_name != 'workflow_dispatch' || matrix.app == inputs.app
        working-directory: apps/${{ matrix.app }}
        run: npm install

      - name: Build Android APK
        if: github.event_name != 'workflow_dispatch' || matrix.app == inputs.app
        working-directory: apps/${{ matrix.app }}
        shell: bash
        run: |
          for attempt in 1 2 3; do
            echo "Android build attempt ${attempt}/3"
            if npm run build:android-ci; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Android build failed after 3 attempts"
              exit 1
            fi
            wait_seconds=$((attempt * 20))
            echo "Transient build failure; retrying in ${wait_seconds}s"
            sleep "$wait_seconds"
          done

      - name: Upload APK
        if: github.event_name != 'workflow_dispatch' || matrix.app == inputs.app
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-debug-apk
          path: apps/${{ matrix.app }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
